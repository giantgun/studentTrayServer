<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background-color: #f3f4f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        margin: 0;
      }
      .container {
        margin: auto;
        background-color: white;
        padding: 5% 7%;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
      }
      img {
        max-width: 100%;
        height: auto;
        margin-bottom: 0px;
      }
      h2 {
        margin: 8px 0;
        text-align: center;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 800;
        color: #111827;
      }
      h3 {
        margin: 0;
        text-align: center;
        font-size: clamp(10px, 5vw, 24px);
        font-weight: 800;
        color: rgba(75, 0, 130, 0.8);
      }
      p {
        text-align: center;
        font-size: clamp(12px, 3vw, 14px);
        color: #6b7280;
        margin-bottom: 24px;
      }
      .verify-button {
        display: block;
        width: 100%;
        background-color: rgb(75, 0, 130);
        color: white;
        text-align: center;
        padding-top: 10px;
        padding-bottom: 10px;
        text-decoration: none;
        font-size: clamp(12px, 3vw, 14px);
        font-weight: 600;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .verify-button:hover {
        background-color: rgba(75, 0, 130, 0.8);
        color: white;
      }
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 24px 0;
        width: 100%;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #e5e7eb;
      }
      .divider-text {
        padding: 0 8px;
        color: #6b7280;
        font-size: clamp(10px, 2.5vw, 12px);
      }
      .footer {
        margin-top: 32px;
        text-align: center;
        font-size: clamp(10px, 2.5vw, 12px);
        color: #6b7280;
      }
      .footer a {
        color: rgb(75, 0, 130);
        text-decoration: none;
        font-weight: 500;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      .logo {
        margin: 5px, auto;
        padding: auto;
        align-items: center;
        text-align: center;
      }
      @media (max-width: 480px) {
        .container {
          padding: 30px;
        }
        .verify-button {
          margin-left: 15px;
          margin-right: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img
          src="http://${process.env.SITE_URL}/logo.jpg"
          width="30"
          alt="Logo"
        />
        <h3>StudentTray</h3>
      </div>
      <h2>Verify Your Email</h2>
      <p>
        Please click the button below to verify your email address and activate
        your account.
      </p>
      <button
        onclick="function redir(){location.href='http://${verificationLink}'}"
        class="verify-button"
      >
        Verify Email
      </button>
      <div class="divider">
        <span class="divider-text">Or copy and paste link in your browser</span>
      </div>
      <p
        style="
          word-break: break-all;
          font-size: clamp(10px, 2.5vw, 12px);
          color: rgb(75, 0, 130);
        "
      >
        http://${verificationLink}
      </p>
      <div class="footer">
        <p>
          Already have an account?
          <a href="http://${process.env.SITE_URL}/login">Log in</a>
        </p>
      </div>
    </div>
  </body>
</html>
